<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0d0d14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060609;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a2a3a;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#3d3d50;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2a2a3a;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a28;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#252535;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#1a1a28;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#12121c;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#1e1e2e;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#12121c;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#9ca3af;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#4b5563;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="starGlow">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <style>
    @keyframes wave1 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-35px); } }
    @keyframes wave2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(30px); } }
    @keyframes wave3 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-20px); } }
    @keyframes twinkle1 { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes twinkle2 { 0%,100% { opacity: 0.6; } 50% { opacity: 0.1; } }
    @keyframes twinkle3 { 0%,100% { opacity: 0.1; } 30% { opacity: 0.8; } 70% { opacity: 0.3; } }
    @keyframes drift { 0%,100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-2px) translateX(1px); } }
    @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.3; } }
    @keyframes lineMove { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
    .w1 { animation: wave1 9s ease-in-out infinite; }
    .w2 { animation: wave2 7s ease-in-out infinite; }
    .w3 { animation: wave3 11s ease-in-out infinite; }
    .t1 { animation: twinkle1 3s ease-in-out infinite; }
    .t2 { animation: twinkle2 4s ease-in-out infinite; }
    .t3 { animation: twinkle3 5s ease-in-out infinite; }
    .t4 { animation: twinkle1 3.5s ease-in-out infinite; }
    .t5 { animation: twinkle2 4.5s ease-in-out infinite; }
    .t6 { animation: twinkle3 6s ease-in-out infinite; }
    .t7 { animation: twinkle1 2.8s ease-in-out infinite; }
    .t8 { animation: twinkle2 5.5s ease-in-out infinite; }
    .drift1 { animation: drift 8s ease-in-out infinite; }
    .glow-bg { animation: pulse 5s ease-in-out infinite; }
    .accent-line { stroke-dasharray: 150; animation: lineMove 15s linear infinite; }
  </style>
  
  <!-- Deep black background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>
  
  <!-- Subtle ambient glow -->
  <ellipse cx="400" cy="90" rx="250" ry="70" fill="url(#glow)" class="glow-bg"/>
  
  <!-- Stars / space particles -->
  <circle class="t1" cx="45" cy="30" r="1" fill="#d1d5db"/>
  <circle class="t2" cx="120" cy="70" r="0.7" fill="#9ca3af"/>
  <circle class="t3" cx="190" cy="25" r="1.2" fill="#e5e7eb"/>
  <circle class="t4" cx="280" cy="55" r="0.8" fill="#d1d5db"/>
  <circle class="t5" cx="350" cy="18" r="0.6" fill="#9ca3af"/>
  <circle class="t6" cx="460" cy="40" r="1" fill="#e5e7eb"/>
  <circle class="t7" cx="530" cy="22" r="0.7" fill="#d1d5db"/>
  <circle class="t8" cx="600" cy="60" r="1.1" fill="#9ca3af"/>
  <circle class="t1" cx="670" cy="28" r="0.8" fill="#e5e7eb"/>
  <circle class="t3" cx="730" cy="50" r="0.6" fill="#d1d5db"/>
  <circle class="t5" cx="760" cy="75" r="0.9" fill="#9ca3af"/>
  <circle class="t2" cx="95" cy="95" r="0.5" fill="#6b7280"/>
  <circle class="t6" cx="700" cy="95" r="0.6" fill="#6b7280"/>
  <circle class="t4" cx="400" cy="150" r="0.5" fill="#4b5563"/>
  
  <!-- Animated mercury accent line -->
  <path class="accent-line" d="M0,135 Q200,125 400,135 Q600,145 800,133" fill="none" stroke="url(#lineGrad)" stroke-width="0.8"/>
  
  <!-- Waves (dark, subtle, mercury-like) -->
  <g class="w3">
    <path d="M-100,158 C0,148 100,168 200,155 C300,142 400,162 500,150 C600,138 700,158 800,145 C900,132 1000,152 1100,140 L1100,200 L-100,200 Z" fill="url(#wave3)"/>
  </g>
  <g class="w1 drift1">
    <path d="M-100,168 C50,155 150,178 250,163 C350,148 450,172 550,158 C650,144 750,168 850,155 C950,142 1050,162 1100,153 L1100,200 L-100,200 Z" fill="url(#wave1)"/>
  </g>
  <g class="w2">
    <path d="M-100,180 C80,170 180,190 280,177 C380,164 480,185 580,173 C680,161 780,180 880,170 C950,162 1050,178 1100,172 L1100,200 L-100,200 Z" fill="url(#wave2)"/>
  </g>
  
  <!-- Name — clean white -->
  <text x="400" y="80" font-family="Segoe UI, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#f9fafb" text-anchor="middle" letter-spacing="1">Yago Santos Silva</text>
  
  <!-- Subtitle — silver/mercury -->
  <text x="400" y="110" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle" letter-spacing="0.5">Estudante de ADS @ Senac  ·  Dev Java, Python &amp; Flutter  ·  Pesquisador PICTA</text>
</svg>
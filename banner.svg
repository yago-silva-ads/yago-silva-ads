<svg width="800" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505"/>
      <stop offset="50%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#050508"/>
    </linearGradient>
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#8b5cf6;stop-opacity:0.7"/>
      <stop offset="70%" style="stop-color:#6366f1;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <style>
    @keyframes pulse1{0%,100%{opacity:.15}50%{opacity:.5}}
    @keyframes pulse2{0%,100%{opacity:.3}50%{opacity:.1}}
    @keyframes pulse3{0%,100%{opacity:.1}50%{opacity:.7}}
    @keyframes scanline{0%{transform:translateY(-220px)}100%{transform:translateY(220px)}}
    @keyframes dash{0%{stroke-dashoffset:1000}100%{stroke-dashoffset:0}}
    @keyframes orbit{0%{transform:rotate(0deg) translateX(60px) rotate(0deg)}100%{transform:rotate(360deg) translateX(60px) rotate(-360deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .p1{animation:pulse1 3s ease-in-out infinite}
    .p2{animation:pulse2 4.5s ease-in-out infinite}
    .p3{animation:pulse3 5s ease-in-out infinite}
    .p4{animation:pulse1 3.8s ease-in-out infinite}
    .p5{animation:pulse2 2.5s ease-in-out infinite}
    .p6{animation:pulse3 6s ease-in-out infinite}
    .scanline{animation:scanline 8s linear infinite;opacity:0.03}
    .dash-anim{stroke-dasharray:200;animation:dash 20s linear infinite}
    .float{animation:float 6s ease-in-out infinite}
  </style>
  
  <!-- Deep black bg -->
  <rect width="800" height="220" fill="url(#bg)"/>
  
  <!-- Perspective grid (subtle) -->
  <g opacity="0.15">
    <line x1="0" y1="180" x2="800" y2="180" stroke="#1a1a2e" stroke-width="0.5"/>
    <line x1="0" y1="195" x2="800" y2="195" stroke="#1a1a2e" stroke-width="0.3"/>
    <line x1="0" y1="205" x2="800" y2="205" stroke="#1a1a2e" stroke-width="0.2"/>
    <line x1="200" y1="160" x2="200" y2="220" stroke="#1a1a2e" stroke-width="0.3"/>
    <line x1="400" y1="160" x2="400" y2="220" stroke="#1a1a2e" stroke-width="0.3"/>
    <line x1="600" y1="160" x2="600" y2="220" stroke="#1a1a2e" stroke-width="0.3"/>
  </g>
  
  <!-- Ambient glows -->
  <ellipse cx="300" cy="100" rx="200" ry="100" fill="url(#glow1)"/>
  <ellipse cx="550" cy="120" rx="150" ry="80" fill="url(#glow2)"/>
  
  <!-- Scanline effect -->
  <rect class="scanline" x="0" y="0" width="800" height="2" fill="#ffffff"/>
  
  <!-- Accent line animated -->
  <path class="dash-anim" d="M100,155 Q250,145 400,155 Q550,165 700,150" fill="none" stroke="url(#accentLine)" stroke-width="1.5"/>
  
  <!-- Stars / particles (various animations) -->
  <circle class="p1" cx="55" cy="35" r="1.2" fill="#e2e8f0"/>
  <circle class="p2" cx="130" cy="80" r="0.8" fill="#94a3b8"/>
  <circle class="p3" cx="210" cy="28" r="1.5" fill="#c4b5fd"/>
  <circle class="p4" cx="320" cy="50" r="0.7" fill="#e2e8f0"/>
  <circle class="p5" cx="440" cy="30" r="1.1" fill="#67e8f9"/>
  <circle class="p6" cx="520" cy="65" r="0.9" fill="#c4b5fd"/>
  <circle class="p1" cx="590" cy="25" r="1.3" fill="#e2e8f0"/>
  <circle class="p3" cx="670" cy="55" r="0.8" fill="#94a3b8"/>
  <circle class="p2" cx="740" cy="35" r="1.0" fill="#67e8f9"/>
  <circle class="p5" cx="95" cy="130" r="0.6" fill="#4b5563"/>
  <circle class="p4" cx="710" cy="120" r="0.7" fill="#4b5563"/>
  <circle class="p6" cx="380" cy="20" r="0.5" fill="#a78bfa"/>
  
  <!-- Decorative brackets -->
  <text x="120" y="103" font-family="JetBrains Mono, monospace" font-size="28" fill="#374151" opacity="0.3">{</text>
  <text x="665" y="103" font-family="JetBrains Mono, monospace" font-size="28" fill="#374151" opacity="0.3">}</text>
  
  <!-- Name -->
  <text class="float" x="400" y="85" font-family="Segoe UI, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5" filter="url(#textGlow)">Yago Santos Silva</text>
  
  <!-- Subtitle with code style -->
  <text x="400" y="118" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#8b5cf6" text-anchor="middle" opacity="0.9">const dev = { java, python, flutter, spring_boot }</text>
  
  <!-- Role -->
  <text x="400" y="140" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="2">ADS @ SENAC  ·  PESQUISADOR PICTA  ·  OPEN TO WORK</text>
  
  <!-- Bottom accent bar -->
  <rect x="250" y="210" width="300" height="1" fill="url(#accentLine)" opacity="0.5"/>
</svg>